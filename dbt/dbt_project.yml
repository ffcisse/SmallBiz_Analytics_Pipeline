name: "funding_pipeline"
version: "1.0.0"
config-version: 2

profile: "funding_pipeline"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
data-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  funding_pipeline:
    staging:
      +materialized: view
      +schema: staging
      +tags:
        - staging
    marts:
      +materialized: table
      +schema: marts
      +tags:
        - marts

seeds:
  +schema: raw
